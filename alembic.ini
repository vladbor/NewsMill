# Alembic configuration for NewsMill database migrations.

[alembic]
# Path to migration scripts directory.
script_location = migrations

# Path to the newsmill source package so that `newsmill.*` imports work.
prepend_sys_path = src

# SQLAlchemy URL is intentionally left empty — it is assembled in
# `migrations/env.py` from the `DB_*` environment variables
# (see `src/newsmill/common/config.py`).
sqlalchemy.url =

# Template used to generate migration files.
file_template = %%(rev)s_%%(slug)s

# Logging configuration for Alembic.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S